{% extends 'acervo/base.html' %}

{% block titulo %}Novo Autor{% endblock %}

{% block conteudo %}
<div class="pagina-form">
    <h1>Novo Autor</h1>
    <form method="post" class="form-livro">
        {% csrf_token %}
        <p>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required>
        </p>
        <button type="submit" class="botao-principal">Salvar</button>
    </form>
</div>
{% endblock %}

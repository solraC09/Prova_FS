{% extends 'acervo/base.html' %}

{% block titulo %}Emprestar Exemplar{% endblock %}

{% block conteudo %}
<div class="pagina-form">
    <h1>Emprestar: {{ exemplar.livro.titulo }}</h1>
    <form method="post" class="form-livro">
        {% csrf_token %}
        <p>
            <label for="membro">Membro</label>
            <select name="membro" id="membro" required>
                {% for membro in membros %}
                <option value="{{ membro.id }}">{{ membro.nome }}</option>
                {% endfor %}
            </select>
        </p>
        <button type="submit" class="botao-principal">Confirmar Empréstimo</button>
    </form>
</div>
{% endblock %}
